name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ChocoBar ${{ github.ref_name }}'
          releaseBody: |
            ## ChocoBar ${{ github.ref_name }}

            请查看下方资源下载对应版本的安装包。

            ### 下载说明
            - **ChocoBar-x.x.x-x64-setup.exe** - 64 位 Windows 安装程序（推荐）
            - **ChocoBar-x.x.x-x64-setup.nsis.zip** - NSIS 安装包压缩版
            - **ChocoBar-x.x.x-x64.msi** - MSI 安装包

            ### 系统要求
            - Windows 10/11 (64-bit)
          releaseDraft: true
          prerelease: false
