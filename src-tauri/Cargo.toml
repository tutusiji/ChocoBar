[package]
name = "choco-panel"
version = "0.1.0"
edition = "2021"

[lib]
name = "choco_panel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "6"
sha2 = "0.10"
base64 = "0.22"
